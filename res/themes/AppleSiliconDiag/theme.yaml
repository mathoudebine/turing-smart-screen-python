---
author: "@tamingchaos"

display:
  DISPLAY_SIZE: 5"
  DISPLAY_ORIENTATION: landscape
  DISPLAY_RGB_LED: 0, 100, 255

static_images:
  BACKGROUND:
    PATH: background.png
    X: 0
    Y: 0
    WIDTH: 800
    HEIGHT: 480

STATS:
  # Row 1: CPU | GPU | MEMORY | CLOCK
  # Consistent order: Usage% → Temp → Detail → Detail2
  CPU:
    PERCENTAGE:
      INTERVAL: 1
      TEXT:
        SHOW: True
        SHOW_UNIT: True
        X: 10
        Y: 22
        FONT: jetbrains-mono/JetBrainsMono-Bold.ttf
        FONT_SIZE: 28
        FONT_COLOR: 255, 255, 255
        BACKGROUND_IMAGE: background.png
      GRAPH:
        SHOW: True
        X: 10
        Y: 142
        WIDTH: 180
        HEIGHT: 10
        MIN_VALUE: 0
        MAX_VALUE: 100
        BAR_COLOR: 60, 140, 255
        BAR_OUTLINE: False
        BACKGROUND_COLOR: 30, 35, 50
    TEMPERATURE:
      INTERVAL: 2
      TEXT:
        SHOW: True
        SHOW_UNIT: True
        X: 10
        Y: 56
        FONT: jetbrains-mono/JetBrainsMono-Bold.ttf
        FONT_SIZE: 28
        FONT_COLOR: 255, 180, 100
        BACKGROUND_IMAGE: background.png
    FREQUENCY:
      INTERVAL: 2
      TEXT:
        SHOW: True
        SHOW_UNIT: True
        X: 10
        Y: 90
        FONT: jetbrains-mono/JetBrainsMono-Bold.ttf
        FONT_SIZE: 26
        FONT_COLOR: 200, 200, 255
        BACKGROUND_IMAGE: background.png
    FAN_SPEED:
      INTERVAL: 2
      TEXT:
        SHOW: True
        SHOW_UNIT: True
        X: 10
        Y: 120
        FONT: jetbrains-mono/JetBrainsMono-Bold.ttf
        FONT_SIZE: 20
        FONT_COLOR: 150, 200, 255
        BACKGROUND_IMAGE: background.png
    LOAD:
